syntax = "proto3";

package apps.notes.note.v1;

import "google/protobuf/timestamp.proto";

// NoteService is the contract of the notes app's note service (apps/notes/services/note),
// also implemented by the service template (templates/service).
// Served over gRPC, gRPC-Web and HTTP/JSON (Connect protocol) from one handler.
//
// Every call is scoped to the caller's tenant (X-Tenant-Id, set by the gateway):
// notes of other tenants are reported as NOT_FOUND. Permissions by tenant role:
//   owner, admin: everything
//   member:       create, read all, update/delete own notes
//   viewer:       read all
service NoteService {
  rpc CreateNote(CreateNoteRequest) returns (CreateNoteResponse);
  rpc GetNote(GetNoteRequest) returns (GetNoteResponse);
  rpc ListNotes(ListNotesRequest) returns (ListNotesResponse);
  rpc UpdateNote(UpdateNoteRequest) returns (UpdateNoteResponse);
  rpc DeleteNote(DeleteNoteRequest) returns (DeleteNoteResponse);
}

message Note {
  uint64 id = 1;
  string title = 2;
  string content = 3;
  google.protobuf.Timestamp create_time = 4;
  google.protobuf.Timestamp update_time = 5;
  // User id of the creator. Members may only update/delete their own notes.
  string created_by = 6;
  // What the caller may do with the note, e.g. to show or hide buttons.
  // Set by GetNote and ListNotes. A hint: update and delete check again.
  NotePermissions permissions = 7;
}

message NotePermissions {
  bool can_update = 1;
  bool can_delete = 2;
}

message CreateNoteRequest {
  // Required. Trimmed, at most 255 characters.
  string title = 1;
  string content = 2;
}

message CreateNoteResponse {
  Note note = 1;
}

message GetNoteRequest {
  uint64 id = 1;
}

message GetNoteResponse {
  Note note = 1;
}

message ListNotesRequest {
  // 1-based. Defaults to 1.
  int32 page = 1;
  // Defaults to 20, capped at 100.
  int32 limit = 2;
}

message ListNotesResponse {
  repeated Note notes = 1;
  int32 page = 2;
  int32 limit = 3;
  int64 total = 4;
}

message UpdateNoteRequest {
  uint64 id = 1;
  // Unset fields are left unchanged.
  optional string title = 2;
  optional string content = 3;
}

message UpdateNoteResponse {
  Note note = 1;
}

message DeleteNoteRequest {
  uint64 id = 1;
}

message DeleteNoteResponse {}
