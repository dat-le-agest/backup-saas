syntax = "proto3";

package authz.v1;

import "google/protobuf/timestamp.proto";

// AuthzService is the centralized relationship-based authorization (ReBAC) of
// the platform, in the style of Zanzibar / OpenFGA. Internal only.
//
// Notation
//   object   "type:id"            e.g. "note:42", "tenant:tnt_a"
//   subject  "type:id"            e.g. "user:usr_1"
//            "type:id#relation"   a userset, e.g. "team:eng#member"
//            "type:*"             wildcard (every subject of the type), only in tuples
//   tuple    object#relation@subject
//
// Relations and how they derive from each other are defined by the active
// authorization model (OpenFGA DSL, schema 1.1). Conditions are not supported yet.
service AuthzService {
  // Does subject have relation on object? Evaluates the model (direct tuples,
  // usersets, computed relations, "x from parent", or / and / but not).
  rpc Check(CheckRequest) returns (CheckResponse);

  // Many checks in one call (e.g. which buttons to show on a page of objects),
  // evaluated concurrently against the same model and tuple revision.
  // Results come back in request order; a check that fails (invalid input,
  // too complex) gets an error without failing the others. At most 50 checks.
  rpc BatchCheck(BatchCheckRequest) returns (BatchCheckResponse);

  // Objects of a type on which subject has relation (e.g. notes alice can view).
  rpc ListObjects(ListObjectsRequest) returns (ListObjectsResponse);

  // Writes and deletes tuples atomically. Idempotent: writing an existing tuple
  // or deleting a missing one is not an error. Each written tuple is validated
  // against the active model. At most 100 tuples + objects per request.
  rpc WriteTuples(WriteTuplesRequest) returns (WriteTuplesResponse);

  // Tuple changes after a sequence number, for consumers keeping caches or
  // indexes in sync. Sequence numbers are assigned at write time and may commit
  // slightly out of order: re-read a small window before last_seq.
  rpc ReadChanges(ReadChangesRequest) returns (ReadChangesResponse);

  // Stores a new model version from DSL; optionally activates it.
  rpc WriteAuthorizationModel(WriteAuthorizationModelRequest) returns (WriteAuthorizationModelResponse);

  // Makes a stored model version the active one.
  rpc ActivateAuthorizationModel(ActivateAuthorizationModelRequest) returns (ActivateAuthorizationModelResponse);

  // A model version, or the active one when id is empty.
  rpc GetAuthorizationModel(GetAuthorizationModelRequest) returns (GetAuthorizationModelResponse);
}

message Tuple {
  string object = 1;
  string relation = 2;
  string subject = 3;
  // Tenant owning the object (export / deletion); required on writes.
  string tenant_id = 4;
}

// How fresh the data behind an answer must be.
enum Consistency {
  // Same as CONSISTENCY_MINIMIZE_LATENCY.
  CONSISTENCY_UNSPECIFIED = 0;
  // Answers may come from cache and miss tuple changes made on other replicas
  // during the last second (changes made through this replica are always seen).
  CONSISTENCY_MINIMIZE_LATENCY = 1;
  // Answers reflect every committed tuple change. Use for sensitive operations
  // right after a permission change.
  CONSISTENCY_HIGHER = 2;
}

message CheckRequest {
  string object = 1;
  string relation = 2;
  string subject = 3;
  // Empty: the active model.
  string authorization_model_id = 4;
  Consistency consistency = 5;
}

message CheckResponse {
  bool allowed = 1;
}

message BatchCheckItem {
  string object = 1;
  string relation = 2;
  string subject = 3;
}

message BatchCheckRequest {
  repeated BatchCheckItem checks = 1;
  // Empty: the active model.
  string authorization_model_id = 2;
  Consistency consistency = 3;
}

message CheckError {
  // Stable code: "invalid_input", "internal"...
  string code = 1;
  string message = 2;
}

message BatchCheckResult {
  // false when error is set
  bool allowed = 1;
  CheckError error = 2;
}

message BatchCheckResponse {
  // One per check, in request order.
  repeated BatchCheckResult results = 1;
}

message ListObjectsRequest {
  // Object type to list, e.g. "note".
  string type = 1;
  string relation = 2;
  string subject = 3;
  // Default 100, max 1000.
  int32 limit = 4;
  string authorization_model_id = 5;
  Consistency consistency = 6;
}

message ListObjectsResponse {
  // "type:id", sorted.
  repeated string objects = 1;
}

message WriteTuplesRequest {
  repeated Tuple writes = 1;
  repeated Tuple deletes = 2;
  // Objects ("type:id") that no longer exist: every tuple on them
  // (note:8#owner@..., shares...) and every tuple naming them as subject
  // (doc:1#editor@team:eng#member when team:eng is deleted) is removed.
  // Applied before deletes and writes.
  repeated string delete_objects = 3;
}

message WriteTuplesResponse {}

message ReadChangesRequest {
  // Empty: all types.
  string object_type = 1;
  int64 after_seq = 2;
  // Default 100, max 1000.
  int32 limit = 3;
}

message TupleChange {
  int64 seq = 1;
  // "write" | "delete"
  string operation = 2;
  Tuple tuple = 3;
  string actor = 4;
  google.protobuf.Timestamp change_time = 5;
}

message ReadChangesResponse {
  repeated TupleChange changes = 1;
  // Pass as after_seq to continue (unchanged when there were no changes).
  int64 last_seq = 2;
}

message WriteAuthorizationModelRequest {
  string dsl = 1;
  bool activate = 2;
}

message WriteAuthorizationModelResponse {
  string id = 1;
}

message ActivateAuthorizationModelRequest {
  string id = 1;
}

message ActivateAuthorizationModelResponse {}

message GetAuthorizationModelRequest {
  string id = 1;
}

message GetAuthorizationModelResponse {
  string id = 1;
  string dsl = 2;
  bool active = 3;
  google.protobuf.Timestamp create_time = 4;
}
