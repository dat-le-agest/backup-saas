apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
    jsonData:
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      # "Logs for this span" → Loki lines with the same trace_id
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        customQuery: true
        query: '{service_name=~".+"} | trace_id = "$${__trace.traceId}"'
      tracesToMetrics:
        datasourceUid: prometheus

  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    # Loki runs without auth (tenant "fake"), but some endpoints still require the
    # tenant header, e.g. drilldown-limits, which Grafana Logs Drilldown calls first
    secureJsonData:
      httpHeaderValue1: fake
    jsonData:
      httpHeaderName1: X-Scope-OrgID
      # trace_id (structured metadata) on a log line → open the trace in Tempo
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
