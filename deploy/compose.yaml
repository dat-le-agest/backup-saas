# Local stack: the platform plus every app.
#
#   make up      build and start everything
#   make down    stop (keeps data volumes; make down-v removes them)
#
#   gateway  http://localhost:8080 (platform: auth, tenants, members)
#   notes    http://localhost:8081 (notes app)
#   postgres localhost:5432 (iam/iam, authz/authz, note/note; superuser postgres/postgres)
#   grafana  http://localhost:3030   (no login)
#   alloy    http://localhost:12345  (pipeline UI)
#
# A new app adds its own compose file (apps/<app>/compose.yaml) to the list below.
name: saas

include:
  - platform.compose.yaml
  - ../apps/notes/compose.yaml
