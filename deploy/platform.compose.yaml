# Platform: the admin dashboard (manages every app), shared infrastructure
# (Postgres, Redis) and observability (Alloy → Tempo / Prometheus / Loki → Grafana).
# Every app runs its own authentication and authorization (core/authn, core/authz).
# Included by deploy/compose.yaml together with every app's compose file.
#
# Services of an app (apps/<app>/compose.yaml) follow the same conventions:
#   label   saas.app: <app>                          Alloy collects its logs, Loki label app=<app>
#   env     OTEL_RESOURCE_ATTRIBUTES: service.namespace=<app>   Prometheus job <app>/<service>

x-service: &service
  restart: unless-stopped
  labels:
    saas.app: platform
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
    alloy: { condition: service_started }
  environment: &service-env
    APP_ENV: dev # dev conveniences (ephemeral keys, dev login in apps)
    LOG_LEVEL: info
    OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
    OTEL_METRIC_EXPORT_INTERVAL: "10000"
    OTEL_RESOURCE_ATTRIBUTES: service.namespace=platform

services:
  # creates the platform's database if missing (idempotent, runs on every up)
  platform-db-init:
    image: postgres:18.6-alpine
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
      - ./postgres/init.sql:/db-init.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/db-init.sql"]

  # the admin dashboard: React UI + API, talks to each app's internal admin API
  admin:
    <<: *service
    build: { context: .., dockerfile: deploy/docker/admin.Dockerfile }
    container_name: admin
    depends_on:
      platform-db-init: { condition: service_completed_successfully }
      alloy: { condition: service_started }
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: admin
      GIN_PORT: "8090"
      DB_DSN: postgres://admin:admin@postgres:5432/admin?sslmode=disable
      # first account of the dashboard (dev only: change it, or set your own)
      ADMIN_BOOTSTRAP_EMAIL: admin@example.com
      ADMIN_BOOTSTRAP_PASSWORD: change-me-admin-password
      GRAFANA_URL: http://localhost:3030
      # managed apps: each app's internal admin URL and its ADMIN_API_KEY
      ADMIN_APPS: >-
        [{"id":"notes","name":"Notes","admin_url":"http://notes-gateway:9081",
          "public_url":"http://localhost:8081","api_key":"dev-notes-admin-key"}]
    ports: ["8090:8090"]

  postgres:
    container_name: postgres
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      # the admin database; each app creates its own with an <app>-db-init job
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]

  alloy:
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports: ["12345:12345"]
    depends_on: [tempo, loki, prometheus]

  tempo:
    image: grafana/tempo:2.10.8
    restart: unless-stopped
    user: "0" # writes to a named volume
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes: [loki-data:/loki]

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3030:3000"]
    depends_on: [prometheus, tempo, loki]

volumes:
  postgres-data:
  tempo-data:
  loki-data:
  prometheus-data:
