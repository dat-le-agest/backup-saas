# Notes app: the notes gateway (public API + the app's own authentication,
# core/authn) and the note service. Included by deploy/compose.yaml; uses the
# platform's Postgres, Redis and Alloy (deploy/platform.compose.yaml).
# Paths here are relative to this folder.

x-service: &service
  restart: unless-stopped
  labels:
    saas.app: notes # Alloy collects the logs, Loki label app=notes
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
    alloy: { condition: service_started }
  environment: &service-env
    APP_ENV: dev
    LOG_LEVEL: info
    REDIS_URL: redis://redis:6379/0
    OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
    OTEL_METRIC_EXPORT_INTERVAL: "10000"
    OTEL_RESOURCE_ATTRIBUTES: service.namespace=notes # Prometheus job notes/<service>

services:
  # creates the app's roles and databases if missing (idempotent, runs on every up)
  notes-db-init:
    image: postgres:18.6-alpine
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
      - ./deploy/db-init.sql:/db-init.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/db-init.sql"]

  note:
    <<: *service
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile, args: { SERVICE: apps/notes/services/note } }
    depends_on:
      notes-db-init: { condition: service_completed_successfully }
      redis: { condition: service_started }
      alloy: { condition: service_started }
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: note
      GIN_PORT: "3000"
      # who decides: rbac (roles only) or rebac (embedded engine); both use authz/authz.yml;
      # the engine records relationships either way, so switching needs no backfill
      AUTHZ_ENFORCE: rbac
      DB_DSN: postgres://note:note@postgres:5432/note?sslmode=disable
      # admin API of its ReBAC engine, reached only through the gateway's admin API
      ADMIN_API_KEY: dev-notes-admin-key
      # every RPC must carry the gateway's internal token; identity headers are ignored
      INTERNAL_AUTH: enforce
      INTERNAL_JWT_JWKS_URL: http://notes-gateway:9081/.well-known/internal-jwks.json

  # public API of the notes app, with its own authentication (core/authn):
  # users, tenants, members and tokens in the notes_auth database
  notes-gateway:
    <<: *service
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile, args: { SERVICE: apps/notes/gateway } }
    depends_on:
      notes-db-init: { condition: service_completed_successfully }
      redis: { condition: service_started }
      alloy: { condition: service_started }
      note: { condition: service_started }
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: notes-gateway
      GIN_PORT: "8081"
      DB_DSN: postgres://notes_auth:notes_auth@postgres:5432/notes_auth?sslmode=disable
      NOTE_SERVICE_URL: http://note:3000
      # internal tokens of the calls to the note service (its INTERNAL_JWT_AUDIENCE);
      # dev signs them with an ephemeral key, elsewhere set INTERNAL_JWT_KEYS_DIR
      NOTE_SERVICE_AUDIENCE: note
      # internal admin API for the admin dashboard: never published
      ADMIN_GIN_PORT: "9081"
      ADMIN_API_KEY: dev-notes-admin-key # the admin service's ADMIN_APPS has the same key
    ports: ["8081:8081"]
