# Notes app: the note service and the notes gateway. Included by deploy/compose.yaml;
# uses the platform's Postgres, Redis, iam, authz and Alloy (deploy/platform.compose.yaml).
# Paths here are relative to this folder.

x-service: &service
  restart: unless-stopped
  labels:
    saas.app: notes # Alloy collects the logs, Loki label app=notes
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
    alloy: { condition: service_started }
  environment: &service-env
    APP_ENV: dev
    LOG_LEVEL: info
    REDIS_URL: redis://redis:6379/0
    OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
    OTEL_METRIC_EXPORT_INTERVAL: "10000"
    OTEL_RESOURCE_ATTRIBUTES: service.namespace=notes # Prometheus job notes/<service>

services:
  # creates the app's roles and databases if missing (idempotent, runs on every up)
  notes-db-init:
    image: postgres:18.6-alpine
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
      - ./deploy/db-init.sql:/db-init.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/db-init.sql"]

  note:
    <<: *service
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile, args: { SERVICE: apps/notes/services/note } }
    depends_on:
      notes-db-init: { condition: service_completed_successfully }
      redis: { condition: service_started }
      alloy: { condition: service_started }
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: note
      GIN_PORT: "3000"
      AUTHZ_SERVICE_URL: http://authz:3002 # sync note relationships to the authz service
      AUTHZ_ENFORCE: rbac                   # switch to rebac after make authz-model + make authz-backfill
      DB_DSN: postgres://note:note@postgres:5432/note?sslmode=disable

  # public REST of the notes app (every route needs an access token)
  notes-gateway:
    <<: *service
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile, args: { SERVICE: apps/notes/gateway } }
    depends_on: [redis, alloy, iam, note]
    # no database
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: notes-gateway
      GIN_PORT: "8081"
      JWT_JWKS_URL: http://iam:3001/.well-known/jwks.json
      JWT_AUDIENCE: notes # only tokens issued for this app
      IAM_SERVICE_URL: http://iam:3001
      NOTE_SERVICE_URL: http://note:3000
    ports: ["8081:8081"]
